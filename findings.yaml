# MP012 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G191"          # your group id, e.g. "G042"
problem_id: "MP012"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "distance_km"  # the column recorded in a different unit
    group_value: "Metro"   # the value of destination whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "weight_kg"
    value: 9999            # the special number typed instead of a blank
    count: 59              # how many rows have it
  duplicate_rows:
    present: false
    count: null            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "hub_backlog"
    start_date: "2026-04-29" # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-05-14"   # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 9               # rows whose target was typed 10 times too big
  spelling_variants:
    present: true
    column: "service"
    true_levels: 3         # how many real categories there are after cleaning

tracking:
  experiment_name: "MP012_Parcel_Delivery_Days"
  best_run_id: "de186362ea27457681b16655fb1a84d1"
  registered_model_name: "parcel_delivery_days"
  champion_version: 2

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    distance_km: 0.0143
    weight_kg: 0.0559
    hub_backlog: 0.0899
    pin_code_tier: 0.002
    declared_value_rs: 0.0407
    transfers: 3.5083
  most_drifted_feature: "transfers"
  mae_by_group:            # v1 on later.csv, per value of destination
    'Metro': 1.7697
    'Tier-2': 0.2739
    'Rural': 0.2741
  worst_served_group: "Metro"
  mae_v1_on_check: 0.7614    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 0.7614    # v2 on the same rows
  decision: "keep"           # promote or keep
