apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp012-api
  labels:
    app: mp012-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp012-api
  template:
    metadata:
      labels:
        app: mp012-api
    spec:
      containers:
        - name: mp012-api
          image: mp012-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: "models/model.joblib"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
